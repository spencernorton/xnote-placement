name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  privacy:
    uses: ./.github/workflows/privacy.yml
    permissions:
      contents: read
  build:
    needs: [checks, privacy]
    container: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Container prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3 build-essential debhelper dpkg-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove stable tag and source
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          git merge-base --is-ancestor HEAD origin/main
          VERSION=$(python3 -c 'import json; print(json.load(open("metadata.json"))["version-name"])')
          test "$RELEASE_TAG" = "v$VERSION"
          grep -q "^## $VERSION — " CHANGELOG.md
      - name: Build twice and compare
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          scripts/build-deb.sh /tmp/one
          scripts/build-deb.sh /tmp/two
          cmp /tmp/one/*.deb /tmp/two/*.deb
          mkdir -p dist
          cp /tmp/one/*.deb dist/
          (cd dist && sha256sum -- *.deb > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnome-shell-extension-xnote-placement-debian-candidate
          path: |
            dist/*.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create release asset directory
        run: mkdir -p release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gnome-shell-extension-xnote-placement-debian-candidate
          path: release-assets
      - name: Package the exact public source and checksum everything
        run: |
          rm release-assets/SHA256SUMS.txt
          git archive --format=tar.gz --prefix=source/ HEAD > release-assets/source.tar.gz
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
      - name: Publish immutable release artifacts
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
